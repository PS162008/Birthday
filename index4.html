<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 18th Birthday Babuuuuu ❤️</title>
    <!-- Cute Handwritten & Aesthetic Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1f1c2c, #928DAB);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Initial Phase Elements (Heading + Square Video + Blast) */
        #introPhase {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        h1 {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
            text-align: center;
        }

        /* Square Video Container */
        .video-box {
            position: relative;
            width: 240px;
            height: 240px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Mini Confetti over video */
        #miniConfetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Envelope Drop & Bounce Animation */
        @keyframes dropAndBounce {
            0% { transform: translateY(-110vh) scale(0.8); opacity: 0; }
            60% { transform: translateY(20px) scale(1); opacity: 1; }
            75% { transform: translateY(-15px) scale(1); }
            90% { transform: translateY(5px) scale(1); }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .envelope-wrapper {
            position: absolute;
            z-index: 10;
            width: 90%;
            max-width: 360px;
            height: 250px;
            background: #ff758c;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            animation: dropAndBounce 1.2s forwards cubic-bezier(0.28, 0.84, 0.42, 1);
            border: 2px solid rgba(255,255,255,0.4);
        }

        .envelope-wrapper.show {
            display: flex;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 180px solid transparent;
            border-right: 180px solid transparent;
            border-top: 125px solid #ff5270;
            transform-origin: top;
            transition: transform 0.4s ease;
        }

        .envelope-btn-text {
            position: relative;
            z-index: 12;
            background: #fff;
            color: #ff3b6c;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-top: 40px;
            transition: transform 0.2s ease;
        }

        .envelope-wrapper:hover .envelope-btn-text {
            transform: scale(1.05);
        }

        /* Real A4 Size Warm Cream Letter Modal */
        .letter-modal {
            position: absolute;
            z-index: 20;
            width: 92%;
            max-width: 420px;
            height: 75vh;
            background: #fcf6bd; /* Warm Yellow / Cream Paper */
            border-radius: 12px;
            padding: 30px 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #e6db85;
            transform: scale(0.7);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .letter-modal.open {
            display: flex;
            transform: scale(1);
            opacity: 1;
        }

        .letter-content {
            flex: 1;
            overflow-y: auto;
            font-family: 'Caveat', cursive; /* Cute handwritten font */
            font-size: 1.8rem;
            color: #d63384; /* Cute Pink */
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            padding-right: 5px;
        }

        /* Blinking Typewriter Cursor */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.6rem;
            background-color: #d63384;
            margin-left: 2px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Next Button inside Letter */
        .next-btn {
            display: none;
            width: 100%;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(211, 51, 132, 0.3);
            text-align: center;
            margin-top: 15px;
            transition: transform 0.2s ease;
        }

        .next-btn.show {
            display: block;
        }

        .next-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Phase 1: Heading, Square Video, & Mini Blast -->
        <div id="introPhase">
            <h1>Happy 18th birthday babuuuuuu❤️🫂😚😚😚</h1>
            <div class="video-box">
                <canvas id="miniConfetti"></canvas>
                <video autoplay muted loop playsinline>
                    <source src="SAGAR" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>

        <!-- Phase 2: Envelope dropping after 3 seconds -->
        <div class="envelope-wrapper" id="envelope" onclick="openEnvelope()">
            <div class="envelope-flap"></div>
            <div class="envelope-btn-text">My wish for you 😘💌</div>
        </div>

        <!-- Phase 3: Real A4 Warm Paper Letter with Typewriter Effect -->
        <div class="letter-modal" id="letterModal">
            <div class="letter-content" id="letterText"></div>
            <button class="next-btn" id="nextBtn" onclick="goToNextPage()">Next Page ➡️</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        // Trigger small party boom over video on load
        window.addEventListener('load', () => {
            const myCanvas = document.getElementById('miniConfetti');
            const myConfetti = confetti.create(myCanvas, { resize: true, useWorker: true });
            
            myConfetti({
                particleCount: 40,
                spread: 70,
                origin: { y: 0.6 }
            });

            // After 3 seconds, hide intro phase and drop envelope
            setTimeout(() => {
                document.getElementById('introPhase').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('introPhase').style.display = 'none';
                    document.getElementById('envelope').classList.add('show');
                }, 500);
            }, 3000);
        });

        // Full message placeholder as requested ("HI SAGAR")
        // Note: Jab tu bada message daale toh bas string change kar dena, typewriter automatically sab type kar dega!
        const messageText = "HI SAGAR";
        let charIndex = 0;
        const letterTextElem = document.getElementById('letterText');
        const nextBtn = document.getElementById('nextBtn');

        function openEnvelope() {
            document.getElementById('envelope').classList.remove('show');
            const letterModal = document.getElementById('letterModal');
            letterModal.classList.add('open');

            // Start Typewriter Effect with blinking cursor
            typeWriter();
        }

        function typeWriter() {
            if (charIndex < messageText.length) {
                // Clear previous and add text with blinking cursor
                letterTextElem.innerHTML = messageText.substring(0, charIndex + 1) + '<span class="cursor"></span>';
                charIndex++;
                setTimeout(typeWriter, 120); // Speed of typing per character
            } else {
                // Remove cursor and show Next button when typing finishes
                letterTextElem.innerHTML = messageText;
                nextBtn.classList.add('show');
            }
        }

        function goToNextPage() {
            window.location.href = "index5.html";
        }
    </script>
</body>
</html>
