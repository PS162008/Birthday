<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Questions for You ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #ff9a9e);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Floating Sparkles, Hearts & Loving Emojis Background Container */
        .magic-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .floating-item {
            position: absolute;
            bottom: -30px;
            font-size: 1.5rem;
            animation: floatUp linear infinite;
            opacity: 0.8;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            20% { opacity: 0.9; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        /* Question Card Container */
        .question-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 25px 20px;
            border-radius: 24px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeInCard 0.4s ease-in-out;
        }

        .question-card.active {
            display: flex;
        }

        @keyframes fadeInCard {
            0% { opacity: 0; transform: scale(0.9) translateY(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Question Text Styling */
        .question-text {
            color: #fff;
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 15px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.15);
            line-height: 1.4;
        }

        /* Loop Video Box inside Question Card */
        .q-video-box {
            width: 180px;
            height: 180px;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            background: #000;
        }

        .q-video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Next Buttons Styling */
        .next-card-btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #fff;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);
            transition: transform 0.2s ease;
        }

        .next-card-btn:active {
            transform: scale(0.95);
        }

        /* Right Side alignment for Q1, Q3 buttons */
        .align-right {
            align-self: flex-end;
            margin-right: 5px;
        }

        /* Center alignment for final Q5 button */
        .align-center {
            align-self: center;
        }
    </style>
</head>
<body>

    <!-- Floating Sparkles, Hearts & Emojis Background -->
    <div class="magic-bg" id="magicBg"></div>

    <!-- Question 1 -->
    <div class="question-card active" id="card1">
        <div class="question-text">1. What's your favourite memory with me? ✨</div>
        <div class="q-video-box">
            <video autoplay muted loop playsinline>
                <source src="SAGAR1.mp4" type="video/mp4">
            </video>
        </div>
        <button class="next-card-btn align-right" onclick="nextCard(2)">Next ➡️</button>
    </div>

    <!-- Question 2 -->
    <div class="question-card" id="card2">
        <div class="question-text">2. What's the one thing you always wants to me? 😅</div>
        <div class="q-video-box">
            <video autoplay muted loop playsinline>
                <source src="SAGAR2.mp4" type="video/mp4">
            </video>
        </div>
        <button class="next-card-btn align-right" onclick="nextCard(3)">Next ➡️</button>
    </div>

    <!-- Question 3 -->
    <div class="question-card" id="card3">
        <div class="question-text">3. What's your biggest insecurity?? And what's my biggest insecurity? 😅</div>
        <div class="q-video-box">
            <video autoplay muted loop playsinline>
                <source src="SAGAR3.mp4" type="video/mp4">
            </video>
        </div>
        <button class="next-card-btn align-right" onclick="nextCard(4)">Next ➡️</button>
    </div>

    <!-- Question 4 -->
    <div class="question-card" id="card4">
        <div class="question-text">4. What's one thing that makes me happy? 😁</div>
        <div class="q-video-box">
            <video autoplay muted loop playsinline>
                <source src="SAGAR4.mp4" type="video/mp4">
            </video>
        </div>
        <button class="next-card-btn align-right" onclick="nextCard(5)">Next ➡️</button>
    </div>

    <!-- Question 5 -->
    <div class="question-card" id="card5">
        <div class="question-text">5. What is the first thing you want to do now that's you are 18?</div>
        <div class="q-video-box">
            <video autoplay muted loop playsinline>
                <source src="SAGAR5.mp4" type="video/mp4">
            </video>
        </div>
        <button class="next-card-btn align-center" onclick="goToFinalPage()">SAGAR</button>
    </div>

    <script>
        // Switch between question cards smoothly
        function nextCard(cardNumber) {
            document.querySelectorAll('.question-card').forEach(card => {
                card.classList.remove('active');
            });
            document.getElementById(`card${cardNumber}`).classList.add('active');
        }

        // Final page redirect
        function goToFinalPage() {
            window.location.href = "index7.html";
        }

        // Floating Sparkles, Hearts & Emojis Generator
        const emojis = ['💖', '✨', '🥺', '🫂', '💗', '⭐', '🥰', '💫'];
        function createMagicElement() {
            const magicBg = document.getElementById("magicBg");
            const item = document.createElement("div");
            item.classList.add("floating-item");
            
            // Randomly pick an emoji or sparkle
            item.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // Random horizontal position, size, and animation duration
            item.style.left = `${Math.random() * 100}vw`;
            const size = Math.random() * 15 + 15; // 15px to 30px
            item.style.fontSize = `${size}px`;
            
            const duration = Math.random() * 4 + 4; // 4s to 8s
            item.style.animationDuration = `${duration}s`;

            magicBg.appendChild(item);

            // Clean up element after animation finishes
            setTimeout(() => {
                item.remove();
            }, duration * 1000);
        }

        // Keep generating background magical elements continuously
        setInterval(createMagicElement, 300);
    </script>
</body>
</html>
