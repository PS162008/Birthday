<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Magical Memories ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #ff9a9e);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Flashlight Effect Overlay */
        .flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #fff;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .flash-overlay.active {
            opacity: 1;
        }

        /* Cute Cartoon Pink Camera Styling */
        .camera-container {
            position: relative;
            z-index: 10;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease;
            animation: cameraShake 1.5s infinite ease-in-out;
        }

        @keyframes cameraShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-4px, 4px) rotate(-2deg); }
            40% { transform: translate(4px, -4px) rotate(2deg); }
            60% { transform: translate(-2px, 2px) rotate(-1deg); }
            80% { transform: translate(2px, -2px) rotate(1deg); }
        }

        .camera-container:hover {
            transform: scale(1.08);
        }

        /* Cartoon Pink Camera Body */
        .cartoon-camera {
            width: 160px;
            height: 120px;
            background: #ff6b81;
            border-radius: 24px;
            position: relative;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            border: 4px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .camera-top {
            position: absolute;
            top: -16px;
            left: 45px;
            width: 70px;
            height: 16px;
            background: #ff4757;
            border-radius: 8px 8px 0 0;
            border: 3px solid #fff;
            border-bottom: none;
        }

        .camera-lens {
            width: 65px;
            height: 65px;
            background: #2f3542;
            border-radius: 50%;
            border: 5px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .lens-inner {
            width: 25px;
            height: 25px;
            background: #70a1ff;
            border-radius: 50%;
            border: 3px solid #dfe4ea;
        }

        .camera-flash {
            position: absolute;
            top: 15px;
            right: 18px;
            width: 18px;
            height: 18px;
            background: #ffa502;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 10px #ffa502;
        }

        .camera-text {
            color: #fff;
            font-weight: 600;
            font-size: 1.1rem;
            margin-top: 15px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Heart Photo Gallery Container */
        .heart-gallery {
            position: absolute;
            width: 100vw;
            height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .heart-gallery.show {
            display: flex;
        }

        /* Individual Photo Nodes with Entry Slide-in Animation from 4 sides */
        .heart-photo {
            position: absolute;
            width: 65px;
            height: 65px;
            border-radius: 12px;
            object-fit: cover;
            border: 3px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            opacity: 0;
            transform: scale(0) translate(0, 0);
            transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        /* Jab gallery active hogi toh saari photos apne heart coordinate par set ho jayengi */
        .heart-gallery.show .heart-photo {
            opacity: 1;
        }

        /* Specific Final Positions forming Heart Shape with individual rotations */
        .heart-gallery.show .p1  { transform: translate(-90px, -90px) rotate(-15deg) scale(1); transition-delay: 0.1s; }
        .heart-gallery.show .p2  { transform: translate(-30px, -110px) rotate(-8deg) scale(1); transition-delay: 0.2s; }
        .heart-gallery.show .p3  { transform: translate(30px, -110px) rotate(8deg) scale(1); transition-delay: 0.3s; }
        .heart-gallery.show .p4  { transform: translate(90px, -90px) rotate(15deg) scale(1); transition-delay: 0.4s; }
        
        .heart-gallery.show .p5  { transform: translate(-130px, -35px) rotate(-20deg) scale(1); transition-delay: 0.5s; }
        .heart-gallery.show .p6  { transform: translate(130px, -35px) rotate(20deg) scale(1); transition-delay: 0.6s; }
        
        .heart-gallery.show .p7  { transform: translate(-110px, 25px) rotate(-10deg) scale(1); transition-delay: 0.7s; }
        .heart-gallery.show .p8  { transform: translate(110px, 25px) rotate(10deg) scale(1); transition-delay: 0.8s; }
        
        .heart-gallery.show .p9  { transform: translate(-75px, 85px) rotate(-5deg) scale(1); transition-delay: 0.9s; }
        .heart-gallery.show .p10 { transform: translate(75px, 85px) rotate(5deg) scale(1); transition-delay: 1.0s; }
        
        .heart-gallery.show .p11 { transform: translate(-25px, 140px) rotate(-2deg) scale(1); transition-delay: 1.1s; }
        .heart-gallery.show .p12 { transform: translate(25px, 140px) rotate(2deg) scale(1); transition-delay: 1.2s; }

        /* Hover Zoom Effect for Clear Face View */
        .heart-photo:hover {
            transform: scale(2.3) rotate(0deg) !important;
            z-index: 50;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        /* Bottom-Right Next Page Button */
        .next-page-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(46, 204, 113, 0.4);
            display: none;
            animation: pulseBtn 1.5s infinite;
        }

        .next-page-btn.show {
            display: block;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Flashlight Overlay -->
    <div class="flash-overlay" id="flashOverlay"></div>

    <!-- Step 1: Cartoon Pink Camera View -->
    <div class="camera-container" id="cameraBox" onclick="clickCamera()">
        <div class="cartoon-camera">
            <div class="camera-top"></div>
            <div class="camera-flash"></div>
            <div class="camera-lens">
                <div class="lens-inner"></div>
            </div>
        </div>
        <div class="camera-text">Tap to click our memories! 📸✨</div>
    </div>

    <!-- Step 2: 12 Photos Heart Shape Gallery (Sliding from outer sides to center heart) -->
    <div class="heart-gallery" id="heartGallery">
        <img src="photo1.jpg" class="heart-photo p1" style="left: -150vw; top: -150vh;">
        <img src="photo2.jpg" class="heart-photo p2" style="left: -50vw; top: -180vh;">
        <img src="photo3.jpg" class="heart-photo p3" style="left: 50vw; top: -180vh;">
        <img src="photo4.jpg" class="heart-photo p4" style="left: 150vw; top: -150vh;">
        
        <img src="photo5.jpg" class="heart-photo p5" style="left: -180vw; top: -20vh;">
        <img src="photo6.jpg" class="heart-photo p6" style="left: 180vw; top: -20vh;">
        
        <img src="photo7.jpg" class="heart-photo p7" style="left: -160vw; top: 40vh;">
        <img src="photo8.jpg" class="heart-photo p8" style="left: 160vw; top: 40vh;">
        
        <img src="photo9.jpg" class="heart-photo p9" style="left: -100vw; top: 150vh;">
        <img src="photo10.jpg" class="heart-photo p10" style="left: 100vw; top: 150vh;">
        
        <img src="photo11.jpg" class="heart-photo p11" style="left: -30vw; top: 180vh;">
        <img src="photo12.jpg" class="heart-photo p12" style="left: 30vw; top: 180vh;">
    </div>

    <!-- Bottom Right Next Page Button -->
    <button class="next-page-btn" id="nextPageBtn" onclick="goToNext()">Next ➡️</button>

    <!-- Audio Elements -->
    <audio id="shutterAudio" src="https://www.soundjay.com/mechanical/camera-shutter-click-01.mp3" preload="auto"></audio>
    <audio id="bgSong" src="song.mp3" preload="auto" loop></audio>

    <script>
        function clickCamera() {
            const flash = document.getElementById("flashOverlay");
            const cameraBox = document.getElementById("cameraBox");
            const heartGallery = document.getElementById("heartGallery");
            const nextPageBtn = document.getElementById("nextPageBtn");
            const shutterAudio = document.getElementById("shutterAudio");
            const bgSong = document.getElementById("bgSong");

            // Play Camera Shutter Sound
            try {
                shutterAudio.currentTime = 0;
                shutterAudio.play();
            } catch (e) {
                console.log("Audio play blocked");
            }

            // Trigger Flashlight Effect
            flash.classList.add("active");

            setTimeout(() => {
                flash.classList.remove("active");
                // Hide camera
                cameraBox.style.display = "none";
                // Show Heart Gallery (Photos will smoothly slide from 4 directions to form heart)
                heartGallery.classList.add("show");
                
                // Play Background Song
                try {
                    bgSong.currentTime = 0;
                    bgSong.play();
                } catch (e) {
                    console.log("Bg song play blocked");
                }

                // Show Bottom-Right Next Button after heart is formed
                setTimeout(() => {
                    nextPageBtn.classList.add("show");
                }, 1500);

            }, 350);
        }

        function goToNext() {
            const bgSong = document.getElementById("bgSong");
            bgSong.pause();
            window.location.href = "index8.html";
        }
    </script>
</body>
</html>
